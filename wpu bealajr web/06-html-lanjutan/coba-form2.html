<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Input Atribut, checkbox & radio</title>
</head>

<body>
    <h1>Contoh Input Atribut, checkbox & radio</h1>    

    <form>
        <label for="name">nama:
          <input type="text" name="nama" id="nama"
          placeholder="Masukkan nama" autocomplete="off"
          autofocus required>
        </label>
        <br>

        <h3>Hobby:</h3>
        <label for="hobby1">olahraga
            <input type="checkbox" name="hobby1" id="hobby1"
            value="olahraga">
        </label>

        <br>
        <button type="submit">Kirim!</button>
        </form>
</body>

</html>
