<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba background</title>

    <style>
        body {
            background-color: lightblue;
            background-image: linear-gradient(to right, purple, blue);
            height: 100vh;
        }

        .kotak1 {
            width: 200px;
            height: 200px;
            background-color: navy;
            background-image: linear-gradient(to left, lightgreen, lightblue);
        }
        .kotak2 {
            width: 200px;
            height: 200px;
            background-color: navy;
            background-image: radial-gradient( rgb(103, 0, 187), rgb(10, 0, 148));
        }
        .kotak3 {
            width: 200px;
            height: 200px;
            background-color: navy;
            background-image: conic-gradient(blue, red, yellow);
        }
    </style>

</head>

<body>
    <div class="kotak1"></div>  
    <div class="kotak2"></div>  
    <div class="kotak3"></div>  
</body>

</html>
