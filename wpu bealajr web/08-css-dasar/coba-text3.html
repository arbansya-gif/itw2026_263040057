<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Text overflow and shadow</title>

    <style>
        p {
            font-size: 26px;
            white-space: nowrap;
            width: 300px;
            background-color: crimson;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        h1 {
            font-size: 100px;
            text-align: center;
            font-family: 'arial', sans-serif;
            text-shadow: 2px 2px 3px orange, 4px 4px 3px yellow;
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-color: blue;
            text-decoration-skip-ink: none;
        }
    </style>
        

</head>

<body>
    <h1>Hello, CSS!</h1>    
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Dolorem ex consequatur eum sapiente animi illo ipsum, praesentium reiciendis mollitia odit placeat inventore culpa quas quaerat assumenda voluptates error eos eveniet.</p>
</body>

</html>
